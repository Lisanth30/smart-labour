{% extends "layout.html" %}

{% block content %}
<div
    style="min-height: calc(100vh - 84px); display: flex; align-items: center; justify-content: center; padding: 4rem 2rem; background: radial-gradient(circle at top right, #eef2ff 0%, transparent 40%), radial-gradient(circle at bottom left, #f0f9ff 0%, transparent 40%);">
    <div class="glass-card animate-up" style="max-width: 600px; width: 100%; border-radius: 24px; padding: 3rem;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <h2 style="font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.5px;">Join
                UrbanService</h2>
            <p style="color: var(--text-muted);">Create an account to get started.</p>
        </div>

        <div
            style="margin-bottom: 2rem; background: #f8fafc; padding: 6px; border-radius: 12px; display: flex; position: relative;">
            <button onclick="toggleRole('customer')" id="btnCust" class="role-toggle active">
                <i class="fas fa-user"></i> I'm a Customer
            </button>
            <button onclick="toggleRole('worker')" id="btnWork" class="role-toggle">
                <i class="fas fa-briefcase"></i> I'm an Expert
            </button>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <input type="hidden" name="role" id="roleInput" value="customer">

            <div class="grid-2" style="margin-bottom: 1.5rem;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" class="form-control" required placeholder="e.g. Alex Morgan">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                </div>
            </div>

            <div class="grid-2" style="margin-bottom: 1.5rem;">
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" class="form-control" required placeholder="+91 98765 43210">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label>City</label>
                <select name="city" id="citySelect" class="form-control" required onchange="loadAreas(this.value)">
                    <option value="">Select your city...</option>
                    {% for city in cities %}
                    <option value="{{ city.id }}">{{ city.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div id="customerFields" class="animate-in">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Local Area</label>
                    <select name="area" id="areaSelect" class="form-control">
                        <option value="">Select area after city...</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>Address Details</label>
                    <textarea name="address" class="form-control" rows="2"
                        placeholder="Start typing your address..."></textarea>
                </div>
            </div>

            <div id="workerFields" style="display: none;" class="animate-in">
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>Your Expertise</label>
                    <select name="service" class="form-control">
                        <option value="">What is your primary skill?</option>
                        {% for service in services %}
                        <option value="{{ service.id }}">{{ service.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-primary hover-scale"
                style="width: 100%; padding: 14px; border-radius: 12px; font-size: 1.1rem; box-shadow: var(--shadow-md);">
                Create Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 2rem; font-size: 0.95rem;">
            Already have an account? <a href="{{ url_for('login') }}" style="font-weight: 700;">Sign in</a>
        </p>
    </div>
</div>

<style>
    .role-toggle {
        flex: 1;
        border: none;
        background: transparent;
        padding: 12px;
        border-radius: 10px;
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .role-toggle.active {
        background: white;
        color: var(--primary);
        box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.1);
        font-weight: 800;
    }

    .form-control {
        background: #fcfcfc;
        transition: all 0.2s;
    }

    .form-control:focus {
        background: white;
        transform: translateY(-1px);
    }
</style>

<script>
    function toggleRole(role) {
        document.getElementById('roleInput').value = role;
        const btnCust = document.getElementById('btnCust');
        const btnWork = document.getElementById('btnWork');

        if (role === 'customer') {
            document.getElementById('customerFields').style.display = 'block';
            document.getElementById('workerFields').style.display = 'none';
            btnCust.classList.add('active');
            btnWork.classList.remove('active');
        } else {
            document.getElementById('customerFields').style.display = 'none';
            document.getElementById('workerFields').style.display = 'block';
            btnCust.classList.remove('active');
            btnWork.classList.add('active');
        }
    }

    async function loadAreas(cityId) {
        if (!cityId) return;
        const areaSelect = document.getElementById('areaSelect');
        areaSelect.disabled = true;
        areaSelect.innerHTML = '<option>Loading areas...</option>';

        try {
            const response = await fetch(`/get_areas/${cityId}`);
            const areas = await response.json();
            areaSelect.innerHTML = '<option value="">Select Area</option>';
            areas.forEach(area => {
                const opt = document.createElement('option');
                opt.value = area.id;
                opt.textContent = area.name;
                areaSelect.appendChild(opt);
            });
        } catch (e) {
            console.error(e);
            areaSelect.innerHTML = '<option>Error loading areas</option>';
        } finally {
            areaSelect.disabled = false;
        }
    }
</script>
{% endblock %}
